<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1C2C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E88D30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Concentric acoustic sound circles -->
  <circle cx="250" cy="250" r="230" stroke="url(#symGrad)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="250" cy="250" r="180" stroke="url(#symGrad)" stroke-width="3"/>
  <circle cx="250" cy="250" r="130" stroke="url(#symGrad)" stroke-width="2"/>
  <circle cx="250" cy="250" r="80" stroke="url(#symGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="30" fill="url(#symGrad)"/>
</svg>
