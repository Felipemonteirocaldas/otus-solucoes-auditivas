<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- Otus Icon / Symbol -->
  <g transform="translate(4, 6)">
    <!-- Shield / Capsule with Burgundy Gradient -->
    <defs>
      <linearGradient id="otusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8B1E2F" />
        <stop offset="100%" stop-color="#5E111E" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F5B041" />
        <stop offset="100%" stop-color="#D97724" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7A1C2C" flood-opacity="0.35"/>
      </filter>
    </defs>
    
    <!-- Emblem Background -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#otusGrad)" filter="url(#glow)"/>
    <rect x="1" y="1" width="58" height="58" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
    
    <!-- Stylized Owl & Sound Wave Hybrid Symbol -->
    <!-- Owl ears / brow -->
    <path d="M17 18 L24 25 C27 23.5 33 23.5 36 25 L43 18 C39 21 39 25 40 27 C46 32 44 42 38 46 C35 48 25 48 22 46 C16 42 14 32 20 27 C21 25 21 21 17 18 Z" fill="white" fill-opacity="0.95"/>
    <!-- Owl Eyes & Inner Sound Waves -->
    <circle cx="24.5" cy="33.5" r="4.5" fill="#1D2D44"/>
    <circle cx="35.5" cy="33.5" r="4.5" fill="#1D2D44"/>
    <circle cx="24.5" cy="33.5" r="2" fill="url(#goldGrad)"/>
    <circle cx="35.5" cy="33.5" r="2" fill="url(#goldGrad)"/>
    <!-- Beak -->
    <path d="M28.5 35 L31.5 35 L30 39 Z" fill="url(#goldGrad)"/>
    <!-- Subtle sound radiating waves below -->
    <path d="M22 42 Q30 46 38 42" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(76, 20)">
    <!-- OTUS Wordmark -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="#1D2D44">
      OTUS
    </text>
    <!-- Accent Dot / Acoustic Node -->
    <circle cx="95" cy="14" r="3.5" fill="#E88D30"/>
    
    <!-- Subtitle: SOLUÇÕES AUDITIVAS -->
    <text x="1" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.2" fill="#7A1C2C">
      SOLUÇÕES AUDITIVAS
    </text>
  </g>
</svg>
